<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>语料标注与仲裁</title>
<style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f6f7f9}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#235347;color:#fff}pre{white-space:pre-wrap;max-height:360px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.warn{color:#9a3412;font-weight:600}.ok{color:#166534;font-weight:600}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.card{background:#eef4f1;border-radius:8px;padding:8px;text-align:center}.card b{display:block;font-size:20px}.arrow{color:#235347;font-weight:700}</style>
<h1>语料标注与争议仲裁</h1>
<section>
  <button onclick="load()">刷新状态</button>
  <div id="cards" class="cards"></div>
  <div id="revision"></div>
  <pre id="state"></pre>
</section>
<section><h2>标注与讨论</h2><div class="grid"><input id="item" type="number" placeholder="条目 ID"><input id="user" type="number" placeholder="用户 ID"><input id="label" placeholder="标签"><textarea id="comment" placeholder="备注（换版后复核者可在此说明）"></textarea><input id="batch" type="number" placeholder="批次 ID"><input id="manager" type="number" placeholder="管理员 ID"></div>
<button onclick="annotate()">提交标注</button><button onclick="loadItem()">查看条目与讨论可见性</button><button onclick="disagreements()">查看分歧</button><button onclick="consistency()">一致性</button><button onclick="summary()">批次待处理</button><button onclick="freeze()">冻结金标准</button><button onclick="gold()">导出金标准</button><pre id="result"></pre></section>
<section><h2>仲裁</h2><input id="arb" type="number" placeholder="仲裁员 ID"><input id="final" placeholder="最终标签"><input id="reason" placeholder="理由至少5字"><button onclick="adjudicate()">提交仲裁</button></section>
<section><h2>指南换版</h2>
<p>每个批次只可有一份待启用指南；启用前提交与仲裁仍按旧版。启用后已有标注回到待复核、旧仲裁不再计入，未提交条目直接用新版；冻结批次保持原结论。</p>
<div class="grid"><input id="rv_version" placeholder="新版版本号，如 v2"><textarea id="rv_rules" placeholder="新版指南全文"></textarea><textarea id="rv_note" placeholder="换版说明（必填）：为什么换、改了什么"></textarea></div>
<input id="rv_batch" type="number" placeholder="批次 ID">
<input id="rv_manager" type="number" placeholder="管理员 ID">
<input id="rv_id" type="number" placeholder="启用时填待启用记录 ID">
<button onclick="submitRevision()">提交待启用指南</button><button onclick="activateRevision()">启用换版</button><pre id="rv_result"></pre></section>
<script>
const result=document.querySelector('#result');
const show=(el,x)=>el.textContent=JSON.stringify(x,null,2);
async function get(u,el=result){return show(el,await(await fetch(u)).json())}
async function post(u,b,el=result){return show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
function card(label,value){return `<div class="card"><b>${value}</b>${label}</div>`}
async function load(){
  const s=await(await fetch('/api/state')).json();
  show(document.querySelector('#state'),s);
  const cards=document.querySelector('#cards');
  if(s.batches&&s.batches.length){
    const b=s.batches[0];
    const p=b.pending||{};
    const rev=b.pending_revision;
    cards.innerHTML=card('批次',b.id)+card('当前指南',b.guideline_id)+
      card('待提交/待复核',p.annotations??'-')+card('其中待复核',p.reviews??0)+
      card('待仲裁',p.arbitrations??0)+card('已提交',p.submitted??0)+
      card('批次状态',b.status)+card('待启用指南',rev?rev.next_version:'无');
    document.querySelector('#revision').innerHTML=rev
      ? `<p class="warn">待启用：<span class="arrow">${rev.previous_version}</span> → <span class="arrow">${rev.next_version}</span>
         （记录 #${rev.id}，${new Date(rev.created_at).toLocaleString()} 登记）<br>说明：${rev.note}<br>
         启用前一切提交与仲裁仍按 ${rev.previous_version} 判定。</p>`
      : (b.revision_count?`<p class="ok">已完成 ${b.revision_count} 次换版，当前按批次指南执行，无待启用记录。</p>`:'');
  }
}
function annotate(){post('/api/annotations',{item_id:+item.value,annotator_id:+user.value,label:label.value,comment:comment.value})}
function loadItem(){get('/api/items/'+item.value+'?user_id='+user.value)}
function disagreements(){get('/api/batches/'+batch.value+'/disagreements')}
function consistency(){get('/api/batches/'+batch.value+'/consistency')}
function summary(){get('/api/batches/'+batch.value+'/summary')}
function gold(){get('/api/batches/'+batch.value+'/gold')}
function adjudicate(){post('/api/adjudications',{item_id:+item.value,arbitrator_id:+arb.value,final_label:final.value,reason:reason.value})}
function freeze(){post('/api/batches/'+batch.value+'/freeze',{manager_id:+manager.value})}
function submitRevision(){post('/api/batches/'+rv_batch.value+'/revisions/submit',{manager_id:+rv_manager.value,version:rv_version.value,rules:rv_rules.value,note:rv_note.value},document.querySelector('#rv_result'))}
function activateRevision(){post('/api/batches/'+rv_batch.value+'/revisions/'+rv_id.value+'/activate',{manager_id:+rv_manager.value},document.querySelector('#rv_result'))}
load();
</script>
</html>
